<body>

            <a href="index.html">Home Dashboard</a> |

            <a href="register.html">Registration (Task 16)</a> |

    <main>
        <h2>Assignment 16: Automated Input Student Registration</h2>
        <p>Please enter your data boundaries below. Native browser validations block empty submissions:</p>

        <form action="#" method="POST">
            <label for="studentName">Student Legal Full Name:</label><br>
            <input type="text" id="studentName" placeholder="Johnathan Doe" required>
            <br><br>

            <label for="studentEmail">Academic Endpoint Email Address:</label><br>
            <input type="email" id="studentEmail" placeholder="student@university.edu" required>
            <br><br>

            <label for="studentPassword">Secure Portal Password Entry:</label><br>
            <input type="password" id="studentPassword" minlength="6" placeholder="Choose strong token" required>
            <br><br>

            <button type="submit">Submit Validated Registration</button>
        </form>
    </main>
</body>
</html>
