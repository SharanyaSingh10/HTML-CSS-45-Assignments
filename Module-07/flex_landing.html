<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Module 7 integrated responsive layout workflows via full flexbox grid parameters.">
    <title>Module 7: Flexbox Infrastructure</title>
    <link rel="stylesheet" href="landing_flex.css">
</head>
<body>

    <!-- Assignment 31 & 34: Responsive Menu Bar + Navbar Hero Section using Flexbox -->
    <nav class="flex-navbar">
        <div class="nav-brand">FlexMatrix</div>
        <div class="nav-links">
            <a href="#login-view">Secure Login Portal</a>
            <a href="#product-view">Product Catalog</a>
        </div>
    </nav>

    <!-- Assignment 34 & 35: Flexbox Landing Page Hero Section Layout -->
    <section class="flex-hero">
        <div class="hero-split-text">
            <h2>The Fluid Flexibility Era</h2>
            <p>Align elements with responsive speed across active monitor views.</p>
        </div>
        <div class="hero-split-visual">
            <img src="https://picsum.photos" alt="Flexbox graphical interface abstraction illustration">
        </div>
    </section>

    <!-- Assignment 33: Product Listing layout configuration inside row wrappers utilizing flex-wrap -->
    <section id="product-view" class="catalog-section">
        <h2>Assignment 33: Dynamic Product Listings Grid</h2>
        <div class="flex-wrap-catalog">
            <div class="catalog-item">Premium Item Block A</div>
            <div class="catalog-item">Premium Item Block B</div>
            <div class="catalog-item">Premium Item Block C</div>
            <div class="catalog-item">Premium Item Block D</div>
        </div>
    </section>

    <!-- Assignment 32: Perfectly centered login form system grid overlay -->
    <section id="login-view" class="fullscreen-center-wrapper">
        <form class="flex-login-card">
            <h3>Portal Authentication</h3>
            <div class="form-row">
                
            </div>
            <div class="form-row">
                <input type="password" placeholder="System Security Key Token" required>
            </div>
            <button type="submit" class="submit-btn">Access Node</button>
        </form>
    </section>

</body>
</html>
