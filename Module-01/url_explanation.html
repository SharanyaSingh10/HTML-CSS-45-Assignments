    <h1>What happens when you type a URL?</h1>
    <p>When you type a URL, the browser queries a DNS server to resolve the domain name into an IP address. Then, an HTTP/HTTPS request is sent to the server. The server processes it and sends back HTML, CSS, and JS files, which the browser parses to render the webpage.</p>
